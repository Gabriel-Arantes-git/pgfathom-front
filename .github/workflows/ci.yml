name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"

jobs:
  # Suíte unitária: sem Docker, sem rede, em todas as plataformas alvo.
  # Quem quiser contribuir um perfil de nomenclatura precisa passar só por aqui.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - run: go build ./...
      - run: go test ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - run: go test -coverprofile=coverage.out ./...
      - name: cobertura de internal/profile
        run: go tool cover -func=coverage.out | grep -E 'internal/profile|^total'

  # Sobe PostgreSQL real via testcontainers. Precisa de Docker, então roda só em
  # Linux e separado do job rápido — quem contribui um perfil de nomenclatura
  # não deveria depender deste job para ter retorno.
  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - run: make test-integration

  # Prova que o binário atravessa as plataformas sem cgo.
  crosscheck:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - run: make crosscheck
